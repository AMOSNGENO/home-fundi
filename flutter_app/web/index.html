<!DOCTYPE html>
<html>
<head>
  <!--

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HOMEFUNDI repair booking, payment, tracking, and chat.">
  <meta name="theme-color" content="#149447">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HOMEFUNDI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #f7fbf4;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: #083f2b;
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      align-items: center;
      border: 3px solid #083f2b;
      box-shadow: 5px 5px 0 #149447;
      color: #e5362d;
      content: "HOMEFUNDI";
      display: flex;
      font-weight: 900;
      height: 54px;
      justify-content: center;
      left: 50%;
      letter-spacing: 1px;
      position: fixed;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 190px;
      z-index: -1;
    }

  <!--
